<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071B31" />

    <!-- Google tag (gtag.js) — page views are sent per-route from App.jsx
         (see the useLocation effect), so no initial `config` call here.
         Consent Mode v2: everything starts denied (no cookies) until the visitor
         accepts in the cookie banner (src/components/CookieConsent.jsx). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var ncConsent = null;
      try { ncConsent = localStorage.getItem('nc_cookie_consent'); } catch (e) {}
      var ncState = ncConsent === 'granted' ? 'granted' : 'denied';
      gtag('consent', 'default', {
        analytics_storage: ncState,
        ad_storage: ncState,
        ad_user_data: ncState,
        ad_personalization: ncState,
        wait_for_update: 500
      });
      // While consent is denied: strip ad identifiers from requests, and keep
      // the gclid in the URL so the Ads click still counts once accepted.
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
      gtag('js', new Date());
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FBHZGW2YB7"></script>

    <!-- Fallback metadata for pre-hydration crawlers; per-route metadata is
         set at runtime via react-helmet-async (see src/components/SEO.jsx). -->
    <title data-pr>NexCommit | Páginas web, tiendas online y chatbots con IA en Chile</title>
    <meta data-pr name="description" content="Creamos páginas web, landing pages, tiendas online, sistemas a medida y chatbots con IA para empresas en todo Chile. Diseño propio, SEO incluido y cotización por WhatsApp." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
