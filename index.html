<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071B31" />

    <!-- Google tag (gtag.js) — page views are sent per-route from App.jsx
         (see the useLocation effect), so no initial `config` call here.
         Measurement without a cookie banner (Ley 19.628, decision 22-10-2026):
         GA4 and Google Ads count visits and contacts from the first page view, but
         never receive the visitor's name, email, phone or tokens. Remarketing
         (ad_personalization) stays off. Anyone can opt out from the privacy page
         (stored as nc_cookie_consent = 'denied', the same key the old banner used,
         so earlier rejections are still respected). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var ncMedir = true;
      try { ncMedir = localStorage.getItem('nc_cookie_consent') !== 'denied'; } catch (e) {}
      var ncState = ncMedir ? 'granted' : 'denied';
      gtag('consent', 'default', {
        analytics_storage: ncState,
        ad_storage: ncState,
        ad_user_data: ncState,
        ad_personalization: 'denied'
      });
      if (!ncMedir) gtag('set', 'ads_data_redaction', true);
      gtag('js', new Date());
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FBHZGW2YB7"></script>

    <!-- Fallback metadata for pre-hydration crawlers; per-route metadata is
         set at runtime via react-helmet-async (see src/components/SEO.jsx). -->
    <title data-pr>NexCommit | Páginas web, tiendas online y chatbots con IA en Chile</title>
    <meta data-pr name="description" content="Creamos páginas web, landing pages, tiendas online, sistemas a medida y chatbots con IA para empresas en todo Chile. Diseño propio, SEO incluido y cotización por WhatsApp." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
